<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="Fluxo de trabalho: dados brutos, KNIME, Python, Power BI, decisão">
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif}
    .mono{font-family:Consolas,'Courier New',monospace}
    .flow{stroke:#fde047;stroke-width:2.5;stroke-dasharray:6 8;animation:flow 1s linear infinite;fill:none}
    @keyframes flow{to{stroke-dashoffset:-14}}
    .node{fill:#161b22;stroke:#30363d;stroke-width:1.5}
    .hot{fill:#fde047;stroke:#fde047}
    .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
  </style>
  <rect width="900" height="170" rx="18" fill="#0d1117"/>
  <rect x=".75" y=".75" width="898.5" height="168.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="30" y="34" class="mono" font-size="13" fill="#8b949e">// como eu trabalho</text>
  <path class="flow" d="M170 85H202"/><path class="flow" d="M342 85H374"/><path class="flow" d="M514 85H546"/><path class="flow" d="M686 85H718"/>
  <g text-anchor="middle" font-size="16" font-weight="700">
    <g class="pop" style="animation-delay:.1s"><rect class="node" x="30" y="55" width="140" height="60" rx="12"/><text x="100" y="91" fill="#e6edf3">Dados brutos</text></g>
    <g class="pop" style="animation-delay:.3s"><rect class="node" x="202" y="55" width="140" height="60" rx="12"/><text x="272" y="91" fill="#e6edf3">KNIME</text></g>
    <g class="pop" style="animation-delay:.5s"><rect class="node" x="374" y="55" width="140" height="60" rx="12"/><text x="444" y="91" fill="#e6edf3">Python</text></g>
    <g class="pop" style="animation-delay:.7s"><rect class="node" x="546" y="55" width="140" height="60" rx="12"/><text x="616" y="91" fill="#e6edf3">Power BI</text></g>
    <g class="pop" style="animation-delay:.9s"><rect class="node hot" x="718" y="55" width="140" height="60" rx="12"/><text x="788" y="91" fill="#0d1117">Decisão</text></g>
  </g>
  <g class="mono" text-anchor="middle" font-size="12" fill="#8b949e">
    <text x="100" y="140">coleta</text><text x="272" y="140">ETL</text><text x="444" y="140">análise</text><text x="616" y="140">dashboard</text><text x="788" y="140">ação</text>
  </g>
</svg>
