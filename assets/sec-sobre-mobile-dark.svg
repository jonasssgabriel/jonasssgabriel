<svg xmlns="http://www.w3.org/2000/svg" width="520" height="52" viewBox="0 0 520 52" role="img" aria-label="01 Sobre"><style>.once{display:none}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .15s cubic-bezier(.3,.7,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .9s ease-out forwards}@keyframes fade{to{opacity:1}}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}@keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.7);opacity:0}}.flow{stroke-dasharray:4 7;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-22}}.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion:reduce){.ring,.flow,.bob,.cur{animation:none!important}.live{display:none}.once{display:inline}}</style><defs></defs><text x="4" y="33" font-family="'JetBrains Mono','Cascadia Code','SF Mono',Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#5b9bff">01</text><text x="42" y="34" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#eaf0fb" textLength="66.0" lengthAdjust="spacingAndGlyphs">Sobre</text><path class="draw" pathLength="1" d="M140 29H516" stroke="#34415a" stroke-width="1.3" fill="none"/><path class="fade" style="animation-delay:.5s" d="M150 29v-9M170 29v-5M190 29v-5M210 29v-5M230 29v-5M250 29v-9M270 29v-5M290 29v-5M310 29v-5M330 29v-5M350 29v-9M370 29v-5M390 29v-5M410 29v-5M430 29v-5M450 29v-9M470 29v-5M490 29v-5M510 29v-5" stroke="#5b9bff" stroke-width="1.2" fill="none" opacity=".85"/></svg>