<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Oi, eu sou o Jonas. Estudo Ciência da Computação em Palmas, Tocantins. Mexo com um pouco de tudo e, ultimamente, com agentes e workflows de IA.">
<style>
.hl{transform-box:fill-box;transform-origin:left center;animation:swipe .7s .25s cubic-bezier(.3,.7,.2,1) both}
@keyframes swipe{from{transform:scaleX(0) rotate(-1deg)}to{transform:scaleX(1) rotate(-1deg)}}
.pen{stroke-dasharray:1;stroke-dashoffset:1;animation:ink 1.1s 1.1s ease-out forwards}
@keyframes ink{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hl,.pen{animation:none;stroke-dashoffset:0}}
</style>
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .17  0 0 0 0 .1  0 0 0 .09 0"/></filter>
<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
</defs>
<rect width="900" height="340" rx="4" fill="#efe9dc"/>
<line x1="0" y1="82" x2="900" y2="82" stroke="#c7d3e4" stroke-width="1.2"/>
<line x1="0" y1="114" x2="900" y2="114" stroke="#c7d3e4" stroke-width="1.2"/>
<line x1="0" y1="146" x2="900" y2="146" stroke="#c7d3e4" stroke-width="1.2"/>
<line x1="0" y1="178" x2="900" y2="178" stroke="#c7d3e4" stroke-width="1.2"/>
<line x1="0" y1="210" x2="900" y2="210" stroke="#c7d3e4" stroke-width="1.2"/>
<line x1="0" y1="242" x2="900" y2="242" stroke="#c7d3e4" stroke-width="1.2"/>
<line x1="0" y1="274" x2="900" y2="274" stroke="#c7d3e4" stroke-width="1.2"/>
<line x1="0" y1="306" x2="900" y2="306" stroke="#c7d3e4" stroke-width="1.2"/>
<line x1="76" y1="0" x2="76" y2="340" stroke="#e39a9a" stroke-width="1.4"/>
<rect width="900" height="340" rx="4" filter="url(#grain)"/>
<rect x="760" y="-8" width="120" height="34" fill="#d8cfb4" opacity=".85" transform="rotate(8 820 10)"/>
<rect class="hl" x="494" y="72" width="214" height="46" fill="#f6d84c" opacity=".85" filter="url(#rough)"/>
<text x="100" y="110" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="700" fill="#22201c" textLength="378" lengthAdjust="spacingAndGlyphs">Oi, eu sou o</text>
<text x="502" y="110" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="700" fill="#22201c" textLength="196" lengthAdjust="spacingAndGlyphs">Jonas.</text>
<text x="100" y="174" font-family="'Courier New',Courier,monospace" font-size="20" fill="#22201c" textLength="600" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >Estudo Ciência da Computação em Palmas, Tocantins.</text>
<text x="100" y="206" font-family="'Courier New',Courier,monospace" font-size="20" fill="#22201c" textLength="732" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >Mexo com um pouco de tudo: site, API, banco, dashboard, rede.</text>
<text x="100" y="238" font-family="'Courier New',Courier,monospace" font-size="20" fill="#22201c" textLength="684" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >Ultimamente muito com agentes e workflows de IA, testando</text>
<text x="100" y="270" font-family="'Courier New',Courier,monospace" font-size="20" fill="#22201c" textLength="684" lengthAdjust="spacingAndGlyphs" xml:space="preserve" >qual o jeito certo de encaixar isso dentro de um projeto.</text>
<path class="pen" pathLength="1" d="M364 243 C424 247 484 240 554 245 S624 242 664 246" fill="none" stroke="#2748a8" stroke-width="2.4" stroke-linecap="round" filter="url(#rough)"/>
<text x="100" y="312" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#2748a8" transform="rotate(-.8 100 312)">ps: a ordem dessa lista muda toda semana.</text>
<rect x=".5" y=".5" width="899" height="339" rx="4" fill="none" stroke="#cdc3aa"/>
</svg>