<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Jonas Gabriel — Dashboards, análise de dados e UI/UX">
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif}
    .mono{font-family:Consolas,'Courier New',monospace}
    .bar{fill:#fde047;transform-box:fill-box;transform-origin:bottom;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    .bar.dim{opacity:.35}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .line{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .9s ease-out forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
    @keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
    .sub{opacity:0;animation:cycle 9s infinite}
    .s2{animation-delay:3s}.s3{animation-delay:6s}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}5%,30%{opacity:1;transform:translateY(0)}35%,100%{opacity:0;transform:translateY(-8px)}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#21262d" stroke-width="1"/></pattern>
    <clipPath id="r"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="900" height="260" fill="#0d1117"/>
    <rect width="900" height="260" fill="url(#g)"/>
    <rect x="0" y="0" width="900" height="6" fill="#fde047"/>
    <g>
      <rect class="bar dim" style="animation-delay:.00s" x="560" y="150" width="22" height="60" rx="3"/>
      <rect class="bar dim" style="animation-delay:.08s" x="596" y="120" width="22" height="90" rx="3"/>
      <rect class="bar dim" style="animation-delay:.16s" x="632" y="140" width="22" height="70" rx="3"/>
      <rect class="bar dim" style="animation-delay:.24s" x="668" y="90"  width="22" height="120" rx="3"/>
      <rect class="bar dim" style="animation-delay:.32s" x="704" y="110" width="22" height="100" rx="3"/>
      <rect class="bar"     style="animation-delay:.40s" x="740" y="60"  width="22" height="150" rx="3"/>
      <rect class="bar dim" style="animation-delay:.48s" x="776" y="80"  width="22" height="130" rx="3"/>
      <rect class="bar"     style="animation-delay:.56s" x="812" y="40"  width="22" height="170" rx="3"/>
      <line x1="548" y1="211" x2="850" y2="211" stroke="#30363d" stroke-width="1.5"/>
      <path class="line" pathLength="1" d="M571 150L607 120L643 140L679 90L715 110L751 60L787 80L823 40"/>
      <circle cx="823" cy="40" r="5" fill="#fff"/>
      <circle class="ring" cx="823" cy="40" r="5" fill="none" stroke="#fde047" stroke-width="2"/>
    </g>
    <g class="mono"><circle class="pulse" cx="48" cy="52" r="5" fill="#22c55e"/><text x="64" y="57" font-size="14" fill="#8b949e">online · Palmas, TO</text></g>
    <text x="46" y="128" font-size="62" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">Jonas Gabriel</text>
    <rect x="48" y="142" width="84" height="5" rx="2.5" fill="#fde047"/>
    <g font-size="22" fill="#fde047" font-weight="600">
      <text class="sub" x="48" y="190">Transformo dados em decisões</text>
      <text class="sub s2" x="48" y="190">Power BI · KNIME · Python</text>
      <text class="sub s3" x="48" y="190">Dashboards bonitos e funcionais</text>
    </g>
    <g class="mono" font-size="14" fill="#8b949e">
      <text x="48" y="228">&gt; Ciência da Computação<tspan class="cursor" fill="#fde047"> ▍</tspan></text>
    </g>
  </g>
  <rect x=".75" y=".75" width="898.5" height="258.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
