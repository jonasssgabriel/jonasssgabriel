<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Jonas Gabriel, Palmas, Tocantins"><style>.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .15s cubic-bezier(.3,.7,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .9s ease-out forwards}@keyframes fade{to{opacity:1}}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}@keyframes ring{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.7);opacity:0}}.flow{stroke-dasharray:4 7;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-22}}.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}</style><defs><pattern id="gm" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#161e2b" stroke-width="1"/></pattern><pattern id="gM" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#1d2839" stroke-width="1"/></pattern></defs><rect width="900" height="150" rx="12" fill="#0e1218"/><rect width="900" height="150" rx="12" fill="url(#gm)"/><rect width="900" height="150" rx="12" fill="url(#gM)"/><path class="draw" pathLength="1" d="M14 14H886V136H14Z" fill="none" stroke="#34415a" stroke-width="1.3"/><g class="fade" style="animation-delay:0s" stroke="#5b9bff" stroke-width="1.2" fill="none"><path d="M35 44h18M44 35v18"/><circle cx="44" cy="44" r="4.5"/></g><g class="fade" style="animation-delay:0s" stroke="#5b9bff" stroke-width="1.2" fill="none"><path d="M847 106h18M856 97v18"/><circle cx="856" cy="106" r="4.5"/></g><text class="fade" x="84" y="79" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#eaf0fb" style="animation-delay:.4s">Jonas Gabriel</text><text class="fade" x="85" y="101" font-family="'JetBrains Mono','Cascadia Code','SF Mono',Consolas,Menlo,monospace" font-size="12.5" letter-spacing="1" fill="#8795ad" style="animation-delay:.5s">PALMAS, TOCANTINS  /  2026</text><rect x="812" y="51" width="4" height="52" fill="#5b9bff"/><text class="fade" x="800" y="75" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code','SF Mono',Consolas,Menlo,monospace" font-size="12" letter-spacing="1.2" fill="#8795ad" style="animation-delay:.6s">FOLHA 1 DE 1</text><text class="fade" x="800" y="97" text-anchor="end" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#eaf0fb" style="animation-delay:.6s">Obrigado pela visita</text></svg>