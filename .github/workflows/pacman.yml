name: pacman

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: gerar svg
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,breakout,galaga'

      - name: recolorir para a paleta do banner
        run: |
          for f in dist/*-dark.svg; do
            sed -i               -e 's/#0d1117/#0b0620/g'               -e 's/#161b22/#1c1245/g'               -e 's/#0e4429/#4a2fb5/g'               -e 's/#006d32/#8a3cff/g'               -e 's/#26a641/#ff3ea5/g'               -e 's/#39d353/#ffd800/g'               -e 's/#8b949e/#9a8cff/g' "$f"
          done

      - name: publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
